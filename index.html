<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oto Tamir Simülatörü</title>
    <style>
        body { font-family: sans-serif; background-color: #1e1e24; color: #fff; text-align: center; padding: 20px; }
        .game-container { background-color: #2a2a35; padding: 20px; border-radius: 10px; max-width: 450px; margin: 0 auto; }
        h1 { color: #ff9f43; }
        .stats { background-color: #353545; padding: 10px; border-radius: 5px; margin-bottom: 15px; font-weight: bold; }
        .log-box { background-color: #15151d; padding: 15px; border-radius: 5px; min-height: 80px; margin-bottom: 15px; text-align: left; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button { background-color: #5f27cd; color: white; border: none; padding: 15px; font-size: 15px; font-weight: bold; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #48dbfb; color: black; }
        button:active { background-color: #341f97; }
        .btn-yes { background-color: #10ac84; }
        .btn-no { background-color: #ee5253; }
    </style>
</head>
<body>
<div class="game-container">
    <h1>🚗 OTO TAMİR SİMÜLASYONU 🛠</h1>
    <div class="stats">
        📆 Gün: <span id="stat-gun">1</span> | 💰 Kasa: <span id="stat-kasa">5000</span> TL<br>
        🔧 Parça: <span id="stat-parca">5</span> | ⭐ İtibar: %<span id="stat-itibar">50</span>
    </div>
    <div id="log" class="log-box">Dükkan açıldı! İş beklemek için "Müşteri Bekle" butonuna basın.</div>
    <div id="main-menu" class="btn-grid">
        <button onclick="musteriBekle()">🔔 Müşteri Bekle</button>
        <button onclick="parcaAl()">📦 Parça Al (300 TL)</button>
        <button onclick="reklamVer()">📢 Reklam Ver (500 TL)</button>
        <button onclick="yenidenBaslat()" style="background-color:#576574;">🔄 Yeniden Başlat</button>
    </div>
    <div id="action-menu" class="btn-grid" style="display: none;">
        <button class="btn-yes" onclick="isKabulEt()">✅ İşi Kabul Et</button>
        <button class="btn-no" onclick="isReddet()">❌ Reddet</button>
    </div>
</div>
<script>
    let kasa = 5000; let parca = 5; let itibar = 50; let gun = 1; let mevcutAriza = null;
    const arizalar = [
        { isim: "Motor Arızası 🛢", parca: 3, kazanc: 1500 },
        { isim: "Fren Değişimi 🛑", parca: 1, kazanc: 600 },
        { isim: "Şanzıman Tamiri ⚙", parca: 4, kazanc: 2200 },
        { isim: "Periyodik Bakım 📋", parca: 1, kazanc: 500 }
    ];
    function ekranGuncelle() {
        document.getElementById("stat-gun").innerText = gun;
        document.getElementById("stat-kasa").innerText = kasa;
        document.getElementById("stat-parca").innerText = parca;
        document.getElementById("stat-itibar").innerText = itibar;
        if (kasa <= 0) { alert("Paranız bitti ve dükkan battı! OYUN BİTTİ."); yenidenBaslat(); }
        else if (itibar <= 0) { alert("İtibarınız sıfırlandı, müşteri gelmiyor! OYUN BİTTİ."); yenidenBaslat(); }
        else if (itibar >= 100) { alert("Tebrikler! Şehrin en popüler dükkanı oldunuz! KAZANDINIZ!"); yenidenBaslat(); }
    }
    function musteriBekle() {
        if (Math.random() < 0.7) {
            mevcutAriza = arizalar[Math.floor(Math.random() * arizalar.length)];
            document.getElementById("log").innerHTML = `🔔 <b>Yeni Müşteri Geldi!</b><br>Arıza: ${mevcutAriza.isim}<br>Gerekli Parça: ${mevcutAriza.parca} adet<br>Kazanç: ${mevcutAriza.kazanc} TL`;
            document.getElementById("main-menu").style.display = "none";
            document.getElementById("action-menu").style.display = "grid";
        } else {
            let gider = Math.floor(Math.random() * 150) + 100; kasa -= gider;
            document.getElementById("log").innerHTML = `💤 Bugün müşteri gelmedi...<br>Kira/Fatura gideri: <b>${gider} TL</b> kasadan düştü.`;
            gun++; ekranGuncelle();
        }
    }
    function isKabulEt() {
        if (parca >= mevcutAriza.parca) {
            parca -= mevcutAriza.parca; kasa += mevcutAriza.kazanc; itibar += 5; if (itibar > 100) itibar = 100;
            document.getElementById("log").innerHTML = `🔧 Tamir başarılı! <b>+${mevcutAriza.kazanc} TL</b> kazandınız.`;
        } else {
            itibar -= 10; if (itibar < 0) itibar = 0;
            document.getElementById("log").innerHTML = `❌ Yeterli parça yoktu! İtibarınız %10 düştü.`;
        }
        gun++; menuyuKapat();
    }
    function isReddet() {
        itibar -= 3; if (itibar < 0) itibar = 0;
        document.getElementById("log").innerHTML = `Müşteriyi reddettiniz. İtibar biraz düştü.`;
        gun++; menuyuKapat();
    }
    function menuyuKapat() {
        document.getElementById("main-menu").style.display = "grid";
        document.getElementById("action-menu").style.display = "none";
        ekranGuncelle();
    }
    function parcaAl() {
        if (kasa >= 300) { kasa -= 300; parca += 1; document.getElementById("log").innerHTML = `📦 1 Adet yedek parça alındı (300 TL).`; ekranGuncelle(); }
        else { document.getElementById("log").innerHTML = `❌ Yetersiz bütçe!`; }
    }
    function reklamVer() {
        if (kasa >= 500) { kasa -= 500; itibar += 15; if (itibar > 100) itibar = 100; document.getElementById("log").innerHTML = `📢 Reklam verildi, itibarınız %15 arttı.`; ekranGuncelle(); }
        else { document.getElementById("log").innerHTML = `❌ Yetersiz bütçe!`; }
    }
    function yenidenBaslat() {
        kasa = 5000; parca = 5; itibar = 50; gun = 1;
        document.getElementById("log").innerHTML = `Dükkan yeniden açıldı!`;
        document.getElementById("main-menu").style.display = "grid";
        document.getElementById("action-menu").style.display = "none";
        ekranGuncelle();
    }
</script>
</body>
</html>
